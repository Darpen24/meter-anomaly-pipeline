name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Offline demo from installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m meter_pipeline --seed 7 --days 28
          python -m meter_pipeline --input "$GITHUB_WORKSPACE/examples/readings.csv" --json-output reports/sample.json
